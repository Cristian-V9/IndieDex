<dialog #dialogo class="ventana" [attr.aria-labelledby]="'ventana-' + clave()" (click)="clicFondo($event)">
  <div class="ventana__caja">
    <header class="ventana__cabecera">
      <h2 [id]="'ventana-' + clave()">{{ pagina().titulo }}</h2>
      <button type="button" class="ventana__cerrar" aria-label="Cerrar" (click)="cerrar()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="ventana__cuerpo">
      <p class="ventana__intro">{{ pagina().intro }}</p>
      @for (s of pagina().secciones; track s.titulo) {
        <h3>{{ s.titulo }}</h3>
        @for (p of s.parrafos; track $index) { <p>{{ p }}</p> }
      }
      <p class="ventana__fecha">Última actualización: {{ pagina().actualizado }}</p>
    </div>
    <footer class="ventana__pie">
      <button type="button" class="boton boton--primario" (click)="cerrar()">Entendido</button>
    </footer>
  </div>
</dialog>
