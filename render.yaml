# Configuración para Render (https://render.com) — ver DESPLIEGUE.md
# En Render: New > Blueprint > elegir este repositorio.
services:
  - type: web
    name: indiedex
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # Dirección JDBC de la base de datos (TiDB Cloud u otro MySQL). Render la pide al crear el servicio.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Clave para firmar los tokens JWT: Render genera una aleatoria
      - key: JWT_SECRET
        generateValue: true
