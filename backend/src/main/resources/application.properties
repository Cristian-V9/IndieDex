# =====================================================================
#  IndieDex - configuración principal
#  Los valores ${VARIABLE:por_defecto} se pueden cambiar sin tocar este
#  archivo: con variables de entorno o creando application-local.properties
#  (ese archivo NO se sube a GitHub; ver application-local.properties.example)
# =====================================================================
spring.application.name=indiedex-backend
spring.config.import=optional:classpath:application-local.properties
server.port=${PORT:8080}

# ---------- Base de datos MySQL ----------
# createDatabaseIfNotExist=true crea la base indiedex_db si no existe.
# Al desplegar, DB_URL reemplaza la dirección completa (ver DESPLIEGUE.md).
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:indiedex_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# Pocas conexiones: suficiente para el proyecto y ahorra memoria en el plan gratuito
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# ---------- JPA / Hibernate ----------
# update: Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# ---------- Seguridad (JWT) ----------
# En producción cambiar JWT_SECRET por una clave larga y privada (mínimo 32 caracteres)
indiedex.jwt.secreto=${JWT_SECRET:indiedex-clave-de-desarrollo-cambiar-en-produccion-2026}
indiedex.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:1440}
# Contraseña propia para "admin" en la página publicada (vacía = se deja indiedex123)
indiedex.admin-password=${ADMIN_PASSWORD:}

# ---------- Reglas de la aplicación ----------
# Origen del frontend Angular permitido por CORS
indiedex.cors.origenes=${CORS_ORIGENES:http://localhost:4200}
# Votos necesarios para que una sugerencia pase de "Sugerencia" a "Votos"
indiedex.sugerencias.umbral-votos=${UMBRAL_VOTOS:5}
# Cargar datos de ejemplo (Dredge, usuarios de prueba...) si la base está vacía
indiedex.datos-ejemplo=true

# ---------- Documentación (Swagger) ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
